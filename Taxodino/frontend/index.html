<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Taxodino</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="static/css/stylee.css">
    <link rel="icon" type="image/png" href="static/img/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="static/img/favicon/favicon.svg" />
    <link rel="shortcut icon" href="static/img/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="static/img/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Taxodino" />
    <link rel="manifest" href="static/img/favicon/site.webmanifest" />
    <style>
        /* Estilos responsivos adicionales específicos para el index */
        @media (max-width: 768px) {
            .search-container {
                padding: 0 15px;
                width: 100%;
            }
            
            .search-box {
                flex-direction: column;
                background: white;
                border-radius: 20px;
                padding: 10px;
                gap: 8px;
            }
            
            .search-input {
                width: 100%;
                padding: 12px 15px;
                font-size: 14px;
            }
            
            .search-btn {
                width: 100%;
                justify-content: center;
                padding: 12px;
                font-size: 14px;
            }
            
            .search-btn img {
                width: 18px;
            }
            
            .filters-section {
                padding: 0 10px;
                gap: 8px;
            }
            
            .filter-btn {
                font-size: 12px;
                padding: 6px 12px;
            }
            
            .filter-btn i {
                font-size: 12px;
            }
            
            .results-count {
                font-size: 12px;
                padding: 0 15px;
            }
        }
        
        @media (max-width: 480px) {
            .filter-btn span {
                display: none;
            }
            
            .filter-btn i {
                margin: 0;
                font-size: 14px;
            }
            
            .filter-btn {
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-container">
        <a href="index.html" class="navbar-brand">
            <img src="static/img/dilophosaurus.png" alt="Dinosaurio">
            <h1>Taxodino</h1>
        </a>

        <div class="nav-links" id="navLinks">
            <a href="index.html" class="nav-link">
                <i class="fas fa-home"></i> <span>Inicio</span>
            </a>
            <a href="mapa_dinosaurios.html" class="nav-link">
                <i class="fas fa-map-marked-alt"></i> <span>Mapa</span>
            </a>
            <a href="favoritos.html" class="nav-link">
                <i class="fas fa-heart"></i> <span>Favoritos</span>
            </a>
            <div class="user-menu" id="userMenu">
                <div class="user-menu-trigger" id="userMenuTrigger">
                    <i class="fas fa-user-circle"></i>
                    <span id="userNameDisplay">Mi Cuenta</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="user-dropdown" id="userDropdown"></div>
            </div>
        </div>
    </div>
</nav>

<div id="dino-bg-container"></div>

<main class="main-content">
    <div class="hero-section">
        <h2><i class="fas fa-volcano"></i> ¡Explora sobre los dinosaurios!</h2>
        <p>Encuentra información fascinante sobre tus dinosaurios favoritos</p>
    </div>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input"
                placeholder="Buscar dinosaurio por nombre, período o dieta...">
            <button id="searchBtn" class="search-btn">
                <img src="static/img/buscador.png" alt="Buscar">
                <span>Buscar</span>
            </button>
        </div>
    </div>

    <div class="filters-section">
        <button class="filter-btn active" data-filter="all">
            <i class="fas fa-globe-americas"></i> <span>Todos</span>
        </button>
        <button class="filter-btn" data-filter="Carnívoro">
            <i class="fas fa-drumstick-bite"></i> <span>Carnívoros</span>
        </button>
        <button class="filter-btn" data-filter="Herbívoro">
            <i class="fas fa-leaf"></i> <span>Herbívoros</span>
        </button>
        <button class="filter-btn" data-filter="Omnívoro">
            <i class="fas fa-egg"></i> <span>Omnívoros</span>
        </button>
    </div>

    <div class="results-count" id="resultsCount"></div>

    <div id="dinosaursGrid" class="dinosaurs-grid">
        <div class="loading-spinner">
            <i class="fas fa-dragon"></i>
            <p>Cargando dinosaurios...</p>
        </div>
    </div>
</main>

<div id="dinoModal" class="modal">
    <div class="modal-content">
        <button class="modal-close">&times;</button>
        <img id="modalImage" class="modal-image" src="" alt="">
        <div class="modal-body">
            <h2 id="modalName"></h2>
            <h3 id="modalScientific"></h3>
            <div class="modal-details" id="modalDetails"></div>
            <div class="modal-description" id="modalDescription"></div>
            <div class="modal-sources" id="modalSources"></div>
        </div>
    </div>
</div>

<footer>
    <div class="footer-content">
        <p>© 2026 Dino Explorers - Todos los derechos reservados</p>
    </div>
</footer>

<script src="static/js/config.js"></script>
<script src="static/js/menu-usuario.js"></script>
<script src="static/js/favoritos.js"></script>
<script src="static/js/dinosaurio.js"></script>

<script>
    // Menú móvil toggle
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const navLinks = document.getElementById('navLinks');
    
    if (mobileMenuBtn) {
        mobileMenuBtn.addEventListener('click', function() {
            navLinks.classList.toggle('show');
            const icon = this.querySelector('i');
            if (navLinks.classList.contains('show')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-times');
            } else {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            }
        });
    }
    
    // Cerrar menú al hacer click en un enlace
    document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', () => {
            if (window.innerWidth <= 768) {
                navLinks.classList.remove('show');
                if (mobileMenuBtn) {
                    const icon = mobileMenuBtn.querySelector('i');
                    icon.classList.remove('fa-times');
                    icon.classList.add('fa-bars');
                }
            }
        });
    });
</script>
</body>
</html>
